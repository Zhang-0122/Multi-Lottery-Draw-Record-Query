name: Update lottery data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "30 14 * * 0,2,4"
    - cron: "30 15 * * 0,2,4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r double/requirements.txt

      - name: Fetch official lottery data
        working-directory: double
        run: python fetch_data.py

      - name: Build standalone dashboard
        working-directory: double
        run: python build_dashboard.py

      - name: Sync release page
        run: python scripts/sync_release.py

      - name: Commit updated data and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add double/ssq_data.json double/dlt_data.json double/fc3d_data.json double/pl3_data.json double/pl5_data.json double/qxc_data.json double/qlc_data.json double/*.html release/*.html
          if git diff --cached --quiet; then
            echo "No lottery data changes to commit."
          else
            git commit -m "chore: update lottery data"
            git push
          fi
